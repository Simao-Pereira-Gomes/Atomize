name: PR Validation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  merge_group:

permissions: {}

# Cancel stale runs after a force-push or follow-up commit. Publishing
# workflows deliberately do not use this policy, but validation does.
concurrency:
  group: validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    # paths-filter uses the pull request file list. Merge-queue jobs run the
    # full gate below, so they do not need a PR comparison.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cli-package: ${{ steps.filter.outputs.cli-package }}
      review-dependencies: ${{ steps.filter.outputs.review-dependencies }}
      bun-dependencies: ${{ steps.filter.outputs.bun-dependencies }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            cli-package:
              - 'packages/cli/**'
              - 'packages/atomize-ai/**'
              - 'packages/atomize-core/**'
              - 'packages/atomize-schema/**'
            review-dependencies:
              - 'package.json'
              - 'bun.lock'
              - '**/package.json'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '.github/workflows/**'
            bun-dependencies:
              - 'package.json'
              - 'bun.lock'
              - '**/package.json'

  package-smoke-test:
    name: Package Smoke Test
    needs: changes
    # Keep the merge queue comprehensive; for ordinary PR updates only pack
    # the CLI when its release dependency closure changed.
    if: >-
      always() &&
      (github.event_name == 'merge_group' || needs.changes.outputs.cli-package == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build AI workspace dependency
        run: bun run build
        working-directory: packages/atomize-ai

      - name: Build package
        run: bun run build
        working-directory: packages/cli

      - name: Test packed CLI
        working-directory: packages/cli
        run: |
          npm pack
          PACKAGE=$(ls *.tgz)
          npm install -g "$PACKAGE"
          atomize --help
          rm "$PACKAGE"

      - name: Validate package contents
        run: bun run validate:package
        working-directory: packages/cli

  dependency-review:
    name: Dependency Review
    needs: changes
    # actions/dependency-review-action only runs in pull_request context; skipped in the merge queue.
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.changes.outputs.review-dependencies == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          # Tauri/Wry's Linux GTK3 stack is pinned to glib 0.18; the advisory is fixed in glib 0.20.
          # Remove this exception when upstream supports the fixed GTK stack.
          allow-ghsas: GHSA-wrw7-89jp-8q8g

  security-audit:
    name: Security Audit
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'merge_group' || needs.changes.outputs.bun-dependencies == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Bun audit
        run: bun audit --audit-level=moderate
