name: PR Validation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  merge_group:

permissions: {}

jobs:
  package-smoke-test:
    name: Package Smoke Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build AI workspace dependency
        run: bun run build
        working-directory: packages/atomize-ai

      - name: Build package
        run: bun run build
        working-directory: packages/cli

      - name: Test packed CLI
        working-directory: packages/cli
        run: |
          npm pack
          PACKAGE=$(ls *.tgz)
          npm install -g "$PACKAGE"
          atomize --help
          rm "$PACKAGE"

      - name: Validate package contents
        run: bun run validate:package
        working-directory: packages/cli

  dependency-review:
    name: Dependency Review
    # actions/dependency-review-action only runs in pull_request context; skipped in the merge queue.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          # Tauri/Wry's Linux GTK3 stack is pinned to glib 0.18; the advisory is fixed in glib 0.20.
          # Remove this exception when upstream supports the fixed GTK stack.
          allow-ghsas: GHSA-wrw7-89jp-8q8g

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Bun audit
        run: bun audit --audit-level=moderate
