name: Validate Studio frontend

on:
  pull_request:
    branches: [main]
    paths:
      - packages/atomize-studio/**
      # Rust has its own cross-platform validation workflow. The frontend job
      # neither builds nor tests src-tauri, so do not duplicate it there.
      - '!packages/atomize-studio/src-tauri/**'
      - packages/atomize-sidecar/**
      - .github/workflows/validate-studio-frontend.yml

permissions: {}

concurrency:
  group: validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  studio-frontend:
    name: Studio frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run test
        working-directory: packages/atomize-studio
      - run: bun run typecheck
        working-directory: packages/atomize-studio
      - run: bun run lint
        working-directory: packages/atomize-studio
      - run: bun run vite:build
        working-directory: packages/atomize-studio
