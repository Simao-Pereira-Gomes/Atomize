name: CodeQL

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main
  merge_group:
  schedule:
    - cron: "30 8 * * 2"

permissions: {}

# Code scanning should follow the latest PR head only. Scheduled and main
# branch scans have distinct refs, so they remain independent.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Rust changes
    # The Rust scan takes minutes and only Studio's src-tauri crate is Rust, so a PR that doesn't
    # touch it skips the scan. Pushes, merge groups and the weekly schedule always scan.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'packages/atomize-studio/src-tauri/**'
              - '.github/workflows/codeql.yml'

  analyze:
    name: Analyze TypeScript
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  analyze-rust:
    name: Analyze Rust
    needs: changes
    # Scan unless this is a PR whose change detection succeeded and found no Rust changes.
    if: >-
      always() &&
      (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.rust == 'true')
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:rust"
