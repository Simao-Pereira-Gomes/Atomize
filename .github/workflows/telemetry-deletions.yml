name: Telemetry deletions

# Processes Deletion Requests (ADR-0060). Thursday, so a request makes PostHog's two-day cutoff for
# the weekend deletion batch. Separate from CI and the publish workflows; it never runs on a push
# or a pull request.
on:
  schedule:
    - cron: "17 6 * * 4"
  workflow_dispatch:

permissions: {}

concurrency:
  group: telemetry-deletions
  cancel-in-progress: false

jobs:
  process:
    name: Process Deletion Requests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fails, naming what is missing, if a secret is not configured; it never passes silently.
      # The script prints counts only, never an Anonymous ID.
      - name: Process Deletion Requests
        run: bun scripts/process-telemetry-deletions.ts
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}