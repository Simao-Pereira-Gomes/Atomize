name: Publish CLI

on:
  push:
    branches: [main]
    paths:
      - packages/cli/**
      - packages/atomize-ai/**
      - packages/atomize-core/**
      - packages/atomize-schema/**

permissions: {}

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if version tag exists
        id: check
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          if git tag -l "${TAG}" | grep -q .; then
            echo "Tag ${TAG} already exists — skipping publish"
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Tag ${TAG} not found — will publish"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

  publish:
    name: Publish to NPM
    needs: check-version
    if: needs.check-version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build AI workspace dependency
        run: bun run build
        working-directory: packages/atomize-ai

      - name: Run tests
        run: bun run test
        working-directory: packages/cli

      - name: Build
        run: bun run build
        working-directory: packages/cli

      - name: Validate package contents
        run: bun run validate:package
        working-directory: packages/cli

      - name: Publish to NPM
        run: npm publish --provenance --access public
        working-directory: packages/cli

      - name: Generate release notes
        # --paths must stay in sync with on.push.paths above (the CLI's
        # dependency closure). See docs/Releasing.md.
        run: |
          bun scripts/release-notes.ts \
            --tag-glob 'v[0-9]*' \
            --new-tag "v${{ needs.check-version.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --surface cli \
            --paths packages/cli,packages/atomize-core,packages/atomize-schema,packages/atomize-ai \
            > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          body_path: ${{ runner.temp }}/release-notes.md
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish summary
        run: |
          echo "### CLI v${{ needs.check-version.outputs.version }} published!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**NPM:** https://www.npmjs.com/package/@sppg2001/atomize/v/${{ needs.check-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** https://github.com/${{ github.repository }}/releases/tag/v${{ needs.check-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
