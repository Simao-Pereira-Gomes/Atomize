name: Validate Studio Rust

on:
  pull_request:
    branches: [main]
    paths:
      - packages/atomize-studio/src-tauri/**
      - .github/workflows/validate-studio-rust.yml
  merge_group:

permissions: {}

concurrency:
  group: validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  studio-rust:
    name: Studio Rust (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: Windows
            runner: windows-latest
          - name: macOS
            runner: macos-14
    defaults:
      run:
        working-directory: packages/atomize-studio/src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/atomize-studio/src-tauri
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # The `tauri` crate links the system GTK/WebKit stack even for `cargo check`.
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
        working-directory: .
      - name: Stage sidecar binaries
        # cargo test/clippy compiles this crate's build.rs, which validates that
        # tauri.conf.json's externalBin resources exist even for a non-bundling run.
        run: bun run sidecar:stage
        working-directory: packages/atomize-studio
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
