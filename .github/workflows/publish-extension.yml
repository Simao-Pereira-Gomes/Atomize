name: Publish VS Code Extension

on:
  push:
    branches: [main]
    paths:
      - packages/vscode-extension/**
      - packages/atomize-core/**
      - packages/atomize-schema/**

permissions: {}

concurrency:
  group: publish-extension
  cancel-in-progress: false

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if version tag exists
        id: check
        run: |
          VERSION=$(node -p "require('./packages/vscode-extension/package.json').version")
          TAG="vscode-v${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          if git tag -l "${TAG}" | grep -q .; then
            echo "Tag ${TAG} already exists — skipping publish"
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Tag ${TAG} not found — will publish"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

  publish:
    name: Publish Extension
    needs: check-version
    if: needs.check-version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck
        working-directory: packages/vscode-extension

      - name: Lint
        run: bun run lint
        working-directory: packages/vscode-extension

      - name: Build
        run: bun run build
        working-directory: packages/vscode-extension

      - name: Package VSIX
        run: bun run package
        working-directory: packages/vscode-extension

      - name: Verify packaged README images
        run: bun run verify:readme-images
        working-directory: packages/vscode-extension

      - name: Publish to VS Code Marketplace
        run: bunx @vscode/vsce publish --no-dependencies --packagePath atomize-${{ needs.check-version.outputs.version }}.vsix
        working-directory: packages/vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Generate release notes
        # --paths must stay in sync with on.push.paths above (the extension's
        # dependency closure). See docs/Releasing.md.
        run: |
          bun scripts/release-notes.ts \
            --tag-glob 'vscode-v*' \
            --new-tag "vscode-v${{ needs.check-version.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --surface extension \
            --paths packages/vscode-extension,packages/atomize-core,packages/atomize-schema \
            > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: vscode-v${{ needs.check-version.outputs.version }}
          name: Extension v${{ needs.check-version.outputs.version }}
          body_path: ${{ runner.temp }}/release-notes.md
          draft: false
          prerelease: false
          make_latest: false
          files: packages/vscode-extension/atomize-${{ needs.check-version.outputs.version }}.vsix
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish summary
        run: |
          echo "### Extension v${{ needs.check-version.outputs.version }} published!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Marketplace:** https://marketplace.visualstudio.com/items?itemName=atomize.atomize" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** https://github.com/${{ github.repository }}/releases/tag/vscode-v${{ needs.check-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
