name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions: {}

jobs:
  test:
    name: Test & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build AI workspace dependency
        run: bun run build
        working-directory: packages/atomize-ai

      - name: Type check
        run: bun run typecheck
        working-directory: packages/cli

      - name: Lint
        run: bun run lint
        working-directory: packages/cli

      - name: Run tests
        run: bun run test
        working-directory: packages/cli

      - name: Build
        run: bun run build
        working-directory: packages/cli

      - name: Upload build artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/cli/dist/
          retention-days: 7

  atomize-core:
    name: Atomize Core
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck
        working-directory: packages/atomize-core

      - name: Run tests
        run: bun run test
        working-directory: packages/atomize-core

  vscode-extension-validation:
    name: VS Code Extension validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck
        working-directory: packages/vscode-extension

      - name: Lint
        run: bun run lint
        working-directory: packages/vscode-extension

      - name: Build
        run: bun run build
        working-directory: packages/vscode-extension

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test, atomize-core]
    permissions:
      contents: read
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run integration tests
        run: bun run test:integration
        working-directory: packages/atomize-core
  validate-templates:
    name: Validate Templates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        working-directory: packages/cli

      - name: Validate backend template
        run: bun run validate ../../examples/backend.atomize.yaml
        working-directory: packages/cli

      - name: Validate frontend template
        run: bun run validate ../../examples/frontend.yaml
        working-directory: packages/cli

      - name: Validate fullstack template
        run: bun run validate ../../examples/fullstack.atomize.yaml
        working-directory: packages/cli

      - name: Validate backend-api template
        run: bun run validate catalog/templates/backend-api.atomize.yaml
        working-directory: packages/cli

      - name: Validate bug-fix template
        run: bun run validate catalog/templates/bug-fix.atomize.yaml
        working-directory: packages/cli

      - name: Validate agile story breakdown template
        run: bun run validate catalog/templates/agile-story-breakdown.atomize.yaml
        working-directory: packages/cli

      - name: Validate feature development template
        run: bun run validate catalog/templates/feature-development.atomize.yaml
        working-directory: packages/cli

      - name: Validate agile story breakdown saved query template
        run: bun run validate catalog/templates/agile-story-breakdown-saved-query.atomize.yaml
        working-directory: packages/cli

  check-schema:
    name: Schema Sync Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check schema is up to date
        run: bun run check-schema
        working-directory: packages/cli

  vscode-extension:
    name: VSCode Extension
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build extension
        run: bun run build
        working-directory: packages/vscode-extension

      - name: Package extension
        run: bun run package
        working-directory: packages/vscode-extension

      - name: Check packaged extension size
        working-directory: packages/vscode-extension
        run: |
          VSIX=$(ls *.vsix)
          SIZE=$(stat -c%s "$VSIX")
          MAX=$((5 * 1024 * 1024))
          echo "Packaged extension: $VSIX ($SIZE bytes)"
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "::error::Packaged extension is ${SIZE} bytes, exceeding the 5MB budget (${MAX} bytes)."
            exit 1
          fi

      - name: Verify packaged README images
        run: bun run verify:readme-images
        working-directory: packages/vscode-extension

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: atomize-vscode.vsix
          path: packages/vscode-extension/*.vsix
          retention-days: 30
