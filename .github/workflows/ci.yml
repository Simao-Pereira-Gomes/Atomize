name: CI

on:
  pull_request:
    branches:
      - main
  merge_group:
permissions: {}

# A newer commit makes an earlier PR run obsolete. Do not consume runner time
# completing checks whose result can no longer be merged.
concurrency:
  group: validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    # The merge queue validates the whole repository. For ordinary PRs this
    # cheap comparison lets the required jobs below be skipped when their
    # dependency closure was not touched.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      core: ${{ steps.filter.outputs.core }}
      schema: ${{ steps.filter.outputs.schema }}
      extension: ${{ steps.filter.outputs.extension }}
      templates: ${{ steps.filter.outputs.templates }}
      scripts: ${{ steps.filter.outputs.scripts }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # Lockfiles and repo-wide tooling can affect every workspace.
            shared:
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.base.json'
              - 'biome.json'
              - '.github/workflows/**'
            cli:
              - 'packages/cli/**'
              - 'packages/atomize-ai/**'
              - 'packages/atomize-core/**'
              - 'packages/atomize-schema/**'
            core:
              - 'packages/atomize-core/**'
              - 'packages/atomize-schema/**'
            schema:
              - 'packages/atomize-schema/**'
              - 'packages/cli/**'
            extension:
              - 'packages/vscode-extension/**'
              - 'packages/atomize-core/**'
              - 'packages/atomize-schema/**'
            templates:
              - 'packages/cli/**'
              - 'packages/atomize-core/**'
              - 'packages/atomize-schema/**'
              - 'examples/**'
              - 'catalog/**'
            scripts:
              - 'scripts/**'
              - '.github/workflows/**'

  test:
    name: Test & Lint (${{ matrix.os }})
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'merge_group' || needs.changes.outputs.cli == 'true' || needs.changes.outputs.shared == 'true')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build AI workspace dependency
        run: bun run build
        working-directory: packages/atomize-ai

      - name: Type check
        run: bun run typecheck
        working-directory: packages/cli

      - name: Lint
        run: bun run lint
        working-directory: packages/cli

      - name: Run tests
        run: bun run test
        working-directory: packages/cli

      - name: Build
        run: bun run build
        working-directory: packages/cli

      - name: Upload build artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/cli/dist/
          retention-days: 7

  atomize-core:
    name: Atomize Core
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'merge_group' || needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck
        working-directory: packages/atomize-core

      - name: Run tests
        run: bun run test
        working-directory: packages/atomize-core

  atomize-schema:
    name: Atomize Schema
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'merge_group' || needs.changes.outputs.schema == 'true' || needs.changes.outputs.shared == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck
        working-directory: packages/atomize-schema

      - name: Run tests
        run: bun run test
        working-directory: packages/atomize-schema

  vscode-extension-validation:
    name: VS Code Extension validation
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'merge_group' || needs.changes.outputs.extension == 'true' || needs.changes.outputs.shared == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck
        working-directory: packages/vscode-extension

      - name: Lint
        run: bun run lint
        working-directory: packages/vscode-extension

      - name: Build
        run: bun run build
        working-directory: packages/vscode-extension

      - name: Package extension
        run: bun run package
        working-directory: packages/vscode-extension

      - name: Check packaged extension size
        working-directory: packages/vscode-extension
        run: |
          VSIX=$(ls *.vsix)
          SIZE=$(stat -c%s "$VSIX")
          MAX=$((5 * 1024 * 1024))
          echo "Packaged extension: $VSIX ($SIZE bytes)"
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "::error::Packaged extension is ${SIZE} bytes, exceeding the 5MB budget (${MAX} bytes)."
            exit 1
          fi

      - name: Verify packaged README images
        run: bun run verify:readme-images
        working-directory: packages/vscode-extension

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: atomize-vscode.vsix
          path: packages/vscode-extension/*.vsix
          retention-days: 30

  integration-test:
    name: Integration Tests
    needs: [changes, test, atomize-core]
    if: >-
      always() &&
      (github.event_name == 'merge_group' || needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run integration tests
        run: bun run test:integration
        working-directory: packages/atomize-core
  validate-templates:
    name: Validate Templates
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'merge_group' || needs.changes.outputs.templates == 'true' || needs.changes.outputs.shared == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        working-directory: packages/cli

      - name: Validate backend template
        run: bun run validate ../../examples/backend.atomize.yaml
        working-directory: packages/cli

      - name: Validate frontend template
        run: bun run validate ../../examples/frontend.yaml
        working-directory: packages/cli

      - name: Validate fullstack template
        run: bun run validate ../../examples/fullstack.atomize.yaml
        working-directory: packages/cli

      - name: Validate backend-api template
        run: bun run validate catalog/templates/backend-api.atomize.yaml
        working-directory: packages/cli

      - name: Validate bug-fix template
        run: bun run validate catalog/templates/bug-fix.atomize.yaml
        working-directory: packages/cli

      - name: Validate agile story breakdown template
        run: bun run validate catalog/templates/agile-story-breakdown.atomize.yaml
        working-directory: packages/cli

      - name: Validate feature development template
        run: bun run validate catalog/templates/feature-development.atomize.yaml
        working-directory: packages/cli

      - name: Validate agile story breakdown saved query template
        run: bun run validate catalog/templates/agile-story-breakdown-saved-query.atomize.yaml
        working-directory: packages/cli

  check-schema:
    name: Schema Sync Check
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'merge_group' || needs.changes.outputs.schema == 'true' || needs.changes.outputs.shared == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check schema is up to date
        run: bun run check-schema
        working-directory: packages/cli

  repo-scripts:
    name: Repo Scripts
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'merge_group' || needs.changes.outputs.scripts == 'true' || needs.changes.outputs.shared == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13

      - name: Test release-notes generator
        run: bun run test:scripts
