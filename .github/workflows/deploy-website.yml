name: Deploy website
on:
  push:
    branches: [main]
    paths:
      - packages/atomize-schema/**
      - packages/atomize-schema-reference/**
      - packages/website/**
  pull_request:
    branches: [main]
    paths:
      - packages/atomize-schema/**
      - packages/atomize-schema-reference/**
      - packages/website/**
      - .github/workflows/deploy-website.yml

permissions: {}
concurrency:
  group: deploy-website-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CLOUDFLARE_PROJECT: atomize

jobs:
  deploy:
    name: ${{ github.event_name == 'push' && 'Deploy production' || 'Deploy preview' }}
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 15
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare secrets are unavailable (e.g. a Dependabot PR) — skipping deploy"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # Previews build the PR head, not the merge commit, so the page's commit
      # label matches a SHA the author recognises.
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.available == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: oven-sh/setup-bun@v2
        if: steps.secrets.outputs.available == 'true'
        with:
          bun-version: 1.3.13

      - if: steps.secrets.outputs.available == 'true'
        run: bun install --frozen-lockfile

      - if: steps.secrets.outputs.available == 'true'
        run: bun run --cwd packages/website build

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.secrets.outputs.available == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          wranglerVersion: 4.150.0
          command: >-
            pages deploy packages/website/dist
            --project-name=${{ env.CLOUDFLARE_PROJECT }}
            --branch=${{ github.event_name == 'push' && 'main' || format('pr-{0}', github.event.pull_request.number) }}
            --commit-hash=${{ github.event.pull_request.head.sha || github.sha }}

      - name: Summarise deployment
        if: steps.deploy.outcome == 'success'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          {
            echo "### Schema Reference deployed"
            echo ""
            echo "- Deployment: ${DEPLOYMENT_URL}/schema"
            if [ -n "$ALIAS_URL" ]; then echo "- Alias: ${ALIAS_URL}/schema"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.deploy.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          marker="<!-- deploy-website-preview -->"
          url="${ALIAS_URL:-$DEPLOYMENT_URL}"
          body="${marker}
          **Schema Reference preview:** ${url}/schema

          Built from ${HEAD_SHA:0:7}. This deployment: ${DEPLOYMENT_URL}/schema"
          comment_id=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n 1)
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${comment_id}" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$body" > /dev/null
          fi
