formatVersion: "1.0"
name: "Unresolved skip"
filter:
  workItemTypes: ["User Story"]
estimation:
  strategy: "percentage"
  rounding: "none"
  ifParentHasNoEstimation: "skip"

tasks:
  - title: "Build"
    estimationPercent: 60
  - title: "Fixed"
    estimationFixed: 2
  - title: "Test"
    estimationPercent: 40
