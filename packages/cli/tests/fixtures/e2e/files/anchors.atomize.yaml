# Conditions reused through YAML anchors (docs: "Reusing conditions")
formatVersion: "1.0"
name: "Anchors"
filter:
  workItemTypes: ["User Story"]
tasks:
  - id: "a"
    title: "API contract" # keep this comment
    estimationPercent: 40
    condition: &api { field: "tags", operator: "contains", value: "api" }
