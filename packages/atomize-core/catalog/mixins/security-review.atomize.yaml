formatVersion: "1.0"
name: "Security Review Tasks"
description: "Example security tasks. Adapt the scope and estimates to the risks relevant to your change."
# Illustrative percentages add to the consuming Template; rebalance its total.
tasks:
  - id: "security-review"
    title: "Security Review: ${story.title}"
    description: "Review security concerns relevant to the change, such as access control or handling sensitive data."
    estimationPercent: 10
    activity: "Development"
    assignTo: "@Unassigned"

  - id: "dependency-audit"
    title: "Dependency Audit: ${story.title}"
    description: "Check changed dependencies for known vulnerabilities using tools appropriate to the project."
    estimationPercent: 5
    activity: "Development"
    assignTo: "@Unassigned"
