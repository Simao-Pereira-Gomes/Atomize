formatVersion: "1.0"
name: "Test Coverage Tasks"
description: "Example testing tasks, including a conditional task. Choose the test types and estimates relevant to your change."
# Illustrative percentages add to the consuming Template; rebalance its total.
tasks:
  - id: "unit-tests"
    title: "Unit Tests: ${story.title}"
    description: "Write unit tests covering the core logic and edge cases."
    estimationPercent: 15
    activity: "Testing"
    assignTo: "@Unassigned"

  - id: "integration-tests"
    title: "Integration Tests: ${story.title}"
    description: "Write integration tests covering interactions between components, APIs, and external dependencies."
    estimationPercent: 10
    activity: "Testing"
    assignTo: "@Unassigned"

  - id: "e2e-tests"
    title: "End-to-End Tests: ${story.title}"
    description: "Validate the full user journey through the feature using E2E test scenarios."
    estimationPercent: 10
    activity: "Testing"
    assignTo: "@Unassigned"
    # Example opt-in tag; replace it with your own condition if needed.
    condition:
      field: "tags"
      operator: "contains"
      value: "e2e"
