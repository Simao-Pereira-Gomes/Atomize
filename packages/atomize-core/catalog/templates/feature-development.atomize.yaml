formatVersion: "1.0"
name: "Feature Development"
description: "Example feature task breakdown with dependencies. Copy or extend it and adapt the steps to your work."
author: "Atomize"
tags: ["example", "feature"]

filter:
  workItemTypes: ["User Story"]
  excludeIfHasTasks: true

tasks:
  - id: "design"
    title: "Design: ${story.title}"
    description: "Describe the intended outcome and an approach suited to this change."
    estimationPercent: 15
    activity: "Design"
    assignTo: "@ParentAssignee"

  - id: "implement"
    title: "Implement: ${story.title}"
    description: "Implement the feature according to the agreed design."
    estimationPercent: 50
    activity: "Development"
    assignTo: "@ParentAssignee"
    dependsOn: ["design"]

  - id: "review"
    title: "Review: ${story.title}"
    description: "Review the change and address feedback relevant to your project."
    estimationPercent: 10
    activity: "Development"
    assignTo: "@Unassigned"
    dependsOn: ["implement"]

  - id: "test"
    title: "Test: ${story.title}"
    description: "Write and execute tests to validate the feature against acceptance criteria."
    estimationPercent: 20
    activity: "Testing"
    assignTo: "@Unassigned"
    dependsOn: ["implement"]

  - id: "deploy"
    title: "Deliver: ${story.title}"
    description: "Complete the handoff or release steps relevant to this change."
    estimationPercent: 5
    activity: "Development"
    assignTo: "@ParentAssignee"
    dependsOn: ["test", "review"]

estimation:
  strategy: "percentage"
  rounding: "none"
  ifParentHasNoEstimation: "warn"

# Example authoring checks; adjust when adding or removing tasks or Mixins.
validation:
  totalEstimationMustBe: 100
  minTasks: 1
  maxTasks: 10

metadata:
  category: "Examples"
  estimationGuidelines: "The percentages are illustrative; adjust them to reflect your work."
  notes: |
    These steps demonstrate task dependencies, not a required delivery process.
    Copy and adapt the Work Item type, tasks, dependencies, and estimates.
    Activities and assignment tokens are examples. Match activities to your
    project and choose which tasks inherit the Story assignee or stay unassigned.
