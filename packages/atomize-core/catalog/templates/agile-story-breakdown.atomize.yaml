formatVersion: "1.0"
name: "Agile Story Breakdown"
description: "Example of conditional tasks and estimates. Adapt the tasks and illustrative tag to your team's workflow."
author: "Atomize"

filter:
  # Change this to the Work Item type used by your project.
  workItemTypes: ["User Story"]
  excludeIfHasTasks: true
  # Alternative: let an existing Azure DevOps query select the Stories.
  # Uncomment savedQuery and replace its path with a query in your project.
  # workItemTypes then declares the types returned; it does not filter the query.
  # savedQuery:
  #   path: "Shared Queries/Example"

tasks:
  - id: "implement"
    title: "Implement: ${story.title}"
    description: "Make the changes needed to meet the acceptance criteria."
    estimationPercent: 60
    activity: "Development"
    assignTo: "@ParentAssignee"
    # Example convention: this tag selects verification work only.
    condition:
      field: tags
      operator: not-contains
      value: verification-only

  - id: "verify"
    title: "Verify: ${story.title}"
    description: "Check the outcome against the acceptance criteria."
    estimationPercent: 40
    activity: "Testing"
    assignTo: "@Unassigned"
    estimationPercentCondition:
      - condition:
          field: tags
          operator: contains
          value: verification-only
        percent: 100

estimation:
  strategy: "percentage"
  rounding: "none"
  ifParentHasNoEstimation: "warn"

# These are authoring checks, not a count of tasks after conditions run.
validation:
  totalEstimationMustBe: 100
  minTasks: 1
  maxTasks: 5

metadata:
  category: "Examples"
  estimationGuidelines: |
    The 60/40 split is illustrative. A Story tagged verification-only generates
    just the verification Task with 100% of the converted Story Estimate.
    Replace the tag and percentages to suit your own work.
  notes: |
    This example demonstrates conditions, not a required delivery process.
    Copy it into your Catalog and adapt the Work Item type, tasks, and estimates.
    Activities and assignment tokens are illustrative; adapt them to your
    project. The commented saved-query alternative demonstrates query selection.
