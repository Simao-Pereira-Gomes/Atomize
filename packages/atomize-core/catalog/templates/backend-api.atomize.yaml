formatVersion: "1.0"
name: "Backend API Development"
description: "Example API task breakdown with Story Estimate conversion. Adapt it to your interface, implementation, and verification needs."
author: "Atomize"
tags: ["example", "api"]

filter:
  # Change this to the Work Item type used by your project.
  workItemTypes: ["User Story"]
  excludeIfHasTasks: true

tasks:
  - id: "design"
    title: "Define API Behavior: ${story.title}"
    description: "Describe the inputs, outputs, and expected behavior relevant to this change."
    estimationPercent: 20
    activity: "Design"
    assignTo: "@ParentAssignee"

  - id: "implement"
    title: "Implement API Change: ${story.title}"
    description: "Make the changes needed for the agreed behavior."
    estimationPercent: 50
    activity: "Development"
    assignTo: "@ParentAssignee"
    dependsOn: ["design"]

  - id: "verify"
    title: "Verify API Behavior: ${story.title}"
    description: "Check expected results, error cases, and compatibility where relevant."
    estimationPercent: 30
    activity: "Testing"
    assignTo: "@Unassigned"
    dependsOn: ["implement"]

estimation:
  strategy: "percentage"
  # Example: one Story Estimate unit becomes four Task Estimate units.
  conversion:
    factor: 4
  # Alternative for a discrete or non-linear scale: replace factor with a table.
  # conversion:
  #   table: { "1": 2, "2": 5, "3": 8, "5": 16 }
  rounding: "nearest"
  ifParentHasNoEstimation: "warn"

validation:
  totalEstimationMustBe: 100

metadata:
  category: "Examples"
  estimationGuidelines: "The factor of 4 and 20/50/30 split are illustrative. Convert the Story Estimate first, distribute it, then round to the nearest half Task unit. Use the commented table alternative for a non-linear scale."
  notes: |
    Copy and adapt this example. It assumes no particular API style, database,
    test framework, documentation tool, or workflow state. Activity names and
    assignment choices are illustrative; adapt them to your project.
    Change the Work Item type and add or remove tasks to fit your project.
