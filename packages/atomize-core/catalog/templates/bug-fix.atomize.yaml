formatVersion: "1.0"
name: "Bug Fix"
description: "Example fixed Task Estimates for investigation, fix, and verification. Copy or extend it to fit how your team handles bugs."
author: "Atomize"
tags: ["example", "bug"]

filter:
  workItemTypes: ["Bug"]
  excludeIfHasTasks: true

tasks:
  - id: "investigate"
    title: "Investigate: ${story.title}"
    description: "Reproduce the bug, identify the root cause, and document findings."
    estimationFixed: 1
    activity: "Requirements"
    assignTo: "@ParentAssignee"

  - id: "fix"
    title: "Fix: ${story.title}"
    description: "Implement the fix for the identified root cause."
    estimationFixed: 2
    activity: "Development"
    assignTo: "@ParentAssignee"
    dependsOn: ["investigate"]

  - id: "verify"
    title: "Verify Fix: ${story.title}"
    description: "Verify the fix resolves the issue and does not introduce regressions."
    estimationFixed: 1
    activity: "Testing"
    assignTo: "@Unassigned"
    dependsOn: ["fix"]

  - id: "close"
    title: "Record Outcome: ${story.title}"
    description: "Record the outcome and any follow-up information useful to your team."
    estimationFixed: 0.5
    activity: "Documentation"
    assignTo: "@ParentAssignee"
    dependsOn: ["verify"]

# Fixed estimates use the Task's unit and do not depend on a Story Estimate.
# These example limits check the fixed estimates, rather than a percentage total.
validation:
  minTasks: 1
  maxTasks: 10
  taskEstimationRange:
    min: 0.5
    max: 8

metadata:
  category: "Examples"
  estimationGuidelines: "Fixed values are illustrative, in the Task unit (typically hours). They are independent of the Story Estimate and bypass percentage rounding."
  notes: |
    Copy and adapt the Work Item type, tasks, dependencies, and estimates.
    Adapt the activity names to your project. Assignment tokens illustrate
    inheriting the Story assignee and leaving verification unassigned.
